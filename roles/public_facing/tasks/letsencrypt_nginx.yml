---
# NOTE: Initial cert creation is a manual process primarily because we'll hopefully never
# have to start from scratch again.  This playbook just keeps the existing certs up to date.
# Renewal uses the apt certbot (nginx authenticator, per /etc/letsencrypt/renewal) driven
# by the cron below; certbot's own schedulers are disabled so the reload hook always runs.

# acme-v01.api.letsencrypt.org was shut down in 2021; clean up the old IPv4 pin
- name: Remove obsolete acme-v01 letsencrypt entry from /etc/hosts
  lineinfile:
    path: /etc/hosts
    regexp: '(.*)letsencrypt(.*)'
    state: absent

- name: Remove obsolete cron forcing IPv4 to acme-v01
  cron:
    name: "Forces letsencrypt to use IPv4 when accessing acme-v01.api.letsencrypt.org"
    state: absent

# The certbot PPA is long dead; the distro packages are current enough
- name: install certbot
  apt:
    name:
      - certbot
      - python3-certbot-nginx
    state: latest
    update_cache: yes

- name: setup a cron to attempt to renew the SSL cert every 15ish days
  cron:
    name: "renew letsencrypt cert"
    minute: "0"
    hour: "0"
    day: "1,15"
    job: "certbot renew --renew-hook='systemctl reload nginx'"

# This cronjob would attempt to renew the cert twice a day but doesn't have our required --renew-hook
- name: make sure certbot's cronbjob is not present
  file:
    path: /etc/cron.d/certbot
    state: absent

# Same thing here.  Let me automate how I wanna automate plz.
- name: make sure certbot's systemd services are disabled
  service:
    name: "{{ item }}"
    state: stopped
    enabled: no
  with_items:
    - "certbot.service"
    - "certbot.timer"
