---
- name: Put logrotate config in place
  template:
    src: templates/download.ceph.com/logrotate.j2
    dest: /etc/logrotate.d/download.ceph.com

# Used for pushing upstream builds
# https://github.com/ceph/ceph-build/blob/main/scripts/sync-push
- name: Add signer user
  user:
    name: signer

# signer_pubkey defined in inventory host_vars
- name: Update signer user's authorized_keys
  authorized_key:
    user: signer
    state: present
    key: "{{ signer_pubkey }}"

# Bitergia used to rsync our http logs to compile metrics for
# metrics.ceph.com; that integration is long dead
- name: Remove bitergia user
  user:
    name: bitergia
    state: absent
    remove: yes

# Mirrors sync from the rsyncd below
- name: Make sure rsync is installed
  apt:
    name: rsync
    state: latest

# Updates download.ceph.com/timestamp
- name: Put make_timestamp script in place
  template:
    src: templates/download.ceph.com/make_timestamp.j2
    dest: /usr/libexec/make_timestamp
    mode: 0775

- name: Create cron entry for make_timestamp
  cron:
    name: "Update download.ceph.com/timestamp"
    minute: "0"
    job: "/usr/libexec/make_timestamp"

# Mirrors sync from us on tcp/873.  No restart handler on purpose: rsyncd
# re-reads this file for every new connection, and a restart would kill
# in-flight mirror syncs.
- name: Put rsyncd config in place
  template:
    src: templates/download.ceph.com/rsyncd.conf.j2
    dest: /etc/rsyncd.conf
    mode: 0644

- name: Enable and start rsync daemon
  systemd:
    name: rsync
    enabled: yes
    state: started

# Per-source-IP limits for download_throttled_subnets.  Everything is at
# http level so the (unmanaged) vhost does not need to change.
- name: Put nginx throttle config in place
  template:
    src: templates/download.ceph.com/nginx-throttle.conf.j2
    dest: /etc/nginx/conf.d/throttle.conf
    mode: 0644
  notify: reload nginx

# Caps rsyncd and download_throttled_subnets egress with tc
- name: Put egress shaper script in place
  template:
    src: templates/download.ceph.com/egress-shaper.sh.j2
    dest: /usr/local/sbin/egress-shaper.sh
    mode: 0755
  notify: restart egress shaper

- name: Put egress shaper unit in place
  template:
    src: templates/download.ceph.com/egress-shaper.service.j2
    dest: /etc/systemd/system/egress-shaper.service
    mode: 0644
  notify: restart egress shaper

- name: Enable and start egress shaper
  systemd:
    name: egress-shaper
    enabled: yes
    state: started
    daemon_reload: yes

- include_tasks: letsencrypt_nginx.yml
