---
# Restart fail2ban
- name: restart fail2ban
  service:
    name: fail2ban
    state: restarted

# Reload fail2ban
- name: reload fail2ban
  service:
    name: fail2ban
    state: reloaded

# Restart sshd (Debian/Ubuntu name the unit ssh, and the sshd alias is
# missing on socket-activated installs like Ubuntu 24.04)
- name: restart sshd
  service:
    name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
    state: restarted

# Reload nginx, but only if the config is valid
- name: reload nginx
  shell: nginx -t && systemctl reload nginx

# Re-apply tc egress shaping
- name: restart egress shaper
  systemd:
    name: egress-shaper
    state: restarted
    daemon_reload: yes

# Restart all deployed Anubis instances
- name: restart anubis
  service:
    name: "anubis@{{ item }}"
    state: restarted
  with_items: "{{ reverse_proxy_sites }}"
  when: reverse_proxy_site_catalog[item].anubis is defined
