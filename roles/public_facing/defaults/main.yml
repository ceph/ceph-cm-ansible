---
## Any of these vars can be overridden in inventory host_vars.

# Don't use ufw by default.
use_ufw: false

# Default to allow SSH traffic.
ufw_allowed_ports:
  - "22"

# Use fail2ban by default
use_fail2ban: true

# Defaults for global fail2ban overrides in /etc/fail2ban/jail.local
# Override in ansible inventory host_vars, group_vars, or some can be
# overridden by service files in the f2b_services dict.  See README.
f2b_ignoreip: "127.0.0.1"
f2b_bantime: "43200" # 12 hours
f2b_findtime: "900" # 15 minutes
f2b_maxretry: 5

# Default fail2ban services to block.  This can be overridden in ansible
# inventory group_vars or host_vars.
f2b_services:
  sshd:
    enabled: "true"
    port: "22"
    maxretry: 3
    findtime: "3600" # 1hr
    filter: "sshd"
    logpath: "{{ sshd_logpath }}"
  sshd-ddos:
    enabled: "true"
    port: "22"
    maxretry: 3
    filter: "sshd-ddos"
    logpath: "{{ sshd_logpath }}"

## download.ceph.com
# OVH caps each instance's public bandwidth.  These keep one heavy client
# from starving everyone else.  See README.
download_public_iface: "{{ ansible_default_ipv4.interface }}"

# Aggregate egress for rsyncd (tcp/873).  tc syntax, e.g. 20mbit.
download_rsync_egress_limit: "20mbit"

# Subnets that are allowed but throttled, both in nginx (per source IP) and
# in tc (aggregate).  GoDaddy's package-mirror hosts saturated the service
# over HTTPS in Sep 2026 (~560 connections, 2TB/day).
download_throttled_subnets:
  - "64.202.160.0/24"
  - "64.202.174.0/24"
download_throttled_subnets_egress_limit: "50mbit"
download_throttle_conn_per_ip: 2
download_throttle_req_per_sec: 5
download_throttle_req_burst: 20
# nginx size syntax, per connection
download_throttle_rate_per_conn: "2m"
