---
- name: Merge managed_users and managed_admin users
  set_fact:
    pubkey_users: "{{ managed_users|list + managed_admin_users|list }}"

- name: Clone the keys repo
  git:
    repo: "{{ keys_repo }}"
    version: "{{ keys_branch }}"
    # http://tracker.ceph.com/issues/16615
    # depth: 1
    force: yes
    dest: "{{ keys_repo_path }}"
  delegate_to: localhost

  become: false
  when: keys_repo is defined
  connection: local
  run_once: true
  register: clone_keys
  until: clone_keys is success
  retries: 5
  delay: 10

- name: Find the pubkeys available in the keys repo
  find:
    paths: "{{ keys_repo_path }}/ssh"
    patterns: "*.pub"
  delegate_to: localhost
  become: false
  connection: local
  run_once: true
  register: found_pubkeys
  when: keys_repo is defined

- name: Build the list of users with a pubkey in the keys repo
  set_fact:
    keys_repo_pubkeys: >-
      {{
        found_pubkeys.files | default([])
        | map(attribute='path')
        | map('basename')
        | map('regex_replace', '\.pub$', '')
        | list
      }}

# A missing pubkey shouldn't be fatal; the user simply doesn't get access.
# The warning is about the keys repo rather than the host, so emit it once on
# the controller instead of once per user per host.
- name: Warn about users with no pubkey in the keys repo
  debug:
    msg: "WARNING: No pubkey found for '{{ item.name }}' in {{ keys_repo }}; skipping their authorized_keys."
  with_items: "{{ pubkey_users }}"
  # The user dicts carry emails and WireGuard peer info; only log the username
  loop_control:
    label: "{{ item.name }}"
  delegate_to: localhost
  become: false
  run_once: true
  when:
    - keys_repo is defined
    - item.key is undefined
    - item.name not in keys_repo_pubkeys

# NOTE: the key has to be a conditional expression rather than
# "item.key | default(lookup(...))" -- Jinja evaluates default()'s argument
# eagerly, so the lookup would run (and fail) for literal-key users who have no
# file in the keys repo.
- name: Update authorized_keys
  authorized_key:
    user: "{{ item.name }}"
    key: "{{ item.key if item.key is defined else lookup('file', keys_repo_path + '/ssh/' + item.name + '.pub') }}"
  with_items: "{{ pubkey_users }}"
  # The user dicts carry emails and WireGuard peer info; only log the username
  loop_control:
    label: "{{ item.name }}"
  when: >-
    item.key is defined
    or (keys_repo is defined and item.name in keys_repo_pubkeys)
