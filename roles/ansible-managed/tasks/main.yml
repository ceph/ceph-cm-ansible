---
- name: Create the sudo group.
  group:
    name: sudo
    state: present
  tags:
   - user

- name: Create the ansible user
  user:
    name: "{{ cm_user }}"
    groups: sudo
    append: yes
    shell: /bin/bash
    state: present
    update_password: on_create
  when: cm_user is defined
  register: user_created
  tags:
   - user

- name: Delete the ansible users password.
  command: "passwd -d {{ cm_user }}"
  when: user_created is defined and user_created is changed
  tags:
   - user

# Write our sudoers.d fragment BEFORE validating /etc/sudoers below.  A node
# imaged from an older capture can carry a stale /etc/sudoers.d/cephlab_sudo
# that newer sudo rejects (e.g. Ubuntu 26.04 dropped `requiretty`), which
# makes `visudo -cf /etc/sudoers` -- and thus the includedir task -- fail on
# the pre-existing file before we ever get a chance to replace it.  Writing
# the current template first clears that.
- name: Create the cephlab_sudo sudoers.d file.
  template:
    src: cephlab_sudo
    dest: /etc/sudoers.d/cephlab_sudo
    owner: root
    group: root
    mode: 0440
    validate: visudo -cf %s
  tags:
    - sudoers
    - user

- name: Ensure includedir is present in sudoers.
  lineinfile:
    dest: /etc/sudoers
    line: "#includedir /etc/sudoers.d"
    state: present
    validate: visudo -cf %s
  tags:
    - sudoers
    - user

- name: Add authorized keys for the ansible user.
  authorized_key: 
    user: "{{ cm_user }}"
    key: "{{ cm_user_ssh_keys|join('\n') }}"
    exclusive: True
  when: cm_user_ssh_keys is defined and
        cm_user is defined
  tags:
    - pubkeys
