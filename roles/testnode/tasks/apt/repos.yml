---
# Mirror-first base Ubuntu sources.  APT's mirror method (mirror+file:)
# tries the local distro mirror first and falls back to the public
# archive automatically — the apt equivalent of the dnf mirror-first
# baseurls used on the RPM distros.
- name: Point base Ubuntu sources at the local distro mirror
  when:
    - ansible_distribution == "Ubuntu"
    - ansible_distribution_release in distro_mirror_ubuntu_releases
  tags:
    - repos
  block:
    - name: Write apt mirrorlist
      template:
        dest: /etc/apt/mirrorlist
        src: apt/mirrorlist.j2
        owner: root
        group: root
        mode: 0644

    - name: Write mirror-first base apt sources
      template:
        dest: /etc/apt/sources.list.d/sepia-mirror.sources
        src: apt/sepia-mirror.sources.j2
        owner: root
        group: root
        mode: 0644

    # The local mirror serves canonical index paths (debmirror does not
    # populate by-hash/), so make APT fetch indexes by canonical name.
    - name: Disable APT by-hash index fetching
      copy:
        content: |
          Acquire::By-Hash "no";
        dest: /etc/apt/apt.conf.d/90sepia-mirror
        owner: root
        group: root
        mode: 0644

    - name: Neuter stock sources.list (replaced by sepia-mirror.sources)
      copy:
        content: |
          # Base sources are managed in
          # /etc/apt/sources.list.d/sepia-mirror.sources (ceph-cm-ansible)
        dest: /etc/apt/sources.list
        owner: root
        group: root
        mode: 0644

    - name: Remove stock ubuntu.sources (replaced by sepia-mirror.sources)
      file:
        path: /etc/apt/sources.list.d/ubuntu.sources
        state: absent

- name: Set apt preferences
  template:
    dest: "/etc/apt/preferences.d/ceph.pref"
    src: "apt/ceph.pref"
    owner: root
    group: root
    mode: 0644
  register: apt_prefs

- name: Ensure keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
    owner: root
    group: root

# The following task used to use the apt_key ansible module.
# apt_key is deprecated because it adds keys to the global keyring, meaning
# any key could be used to authenticate any repo. Instead, we store each key
# under /etc/apt/keyrings/ and require each repo entry to reference its key
# explicitly via signed-by= (enforced by the assert task below).

- name: Install apt keys
  get_url:
    url: "{{ item.url }}"
    dest: "/etc/apt/keyrings/{{ item.name }}"
    mode: '0644'
    owner: root
    group: root
  loop:
    - { url: "http://{{ key_host }}/keys/autobuild.asc", name: "autobuild.asc" }
    - { url: "http://{{ key_host }}/keys/release.asc",   name: "release.asc" }
  # try for 2 minutes before failing
  register: key_download
  until: key_download is succeeded
  retries: 24
  delay: 5

# required for apt_repository
- name: Install python-apt
  apt:
    name: "{{ python_apt_package_name|default('python-apt') }}"
    state: present

- name: Verify apt repo strings include signed-by
  assert:
    that:
      - "'signed-by=' in item"
    fail_msg: >-
      apt repo entry is missing a signed-by= option: "{{ item }}"
      Entries must reference a key under /etc/apt/keyrings/, e.g.
      [signed-by=/etc/apt/keyrings/release.asc]
  loop: "{{ apt_repos|list + common_apt_repos|list }}"
  when: (apt_repos|list + common_apt_repos|list) | length > 0

- name: Add local apt repos.
  apt_repository:
    repo: "{{ item }}"
    state: present
    update_cache: no
    mode: 0644
  with_items: "{{ apt_repos|list + common_apt_repos|list }}"
  register: local_apt_repos
  when: ansible_architecture != "aarch64"
