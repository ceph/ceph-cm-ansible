  - sysstat
  - libedit
  - boost-thread
  - xfsprogs
  - gdisk
  - parted
  - libgcrypt
  - fuse-libs
  - openssl
  - libuuid
  - podman
  # for cephadmunit.py to uniformly run 'docker kill -p ...'
# Doesn't exist yet
#  - podman-docker
  - attr
#  - ant
  - lsof
  - gettext
  - bc
  - xfsdump
  - blktrace
  - usbredir
#  - libev-devel
  - valgrind
  - nfs-utils
  # for xfstests
  - ncurses-devel
  # for s3 tests
  # for workunits,
  - gcc
  - git
  # qa/workunits/rados/test_python.sh
#  - python3-nose
  # for cram tests
#  - python3-virtualenv
  # for rbd qemu tests
  - genisoimage
  - qemu-img
  - qemu-kvm-core
  - qemu-kvm-block-rbd
  # for pjd tests
  - perl-Test-Harness
  - libacl-devel
  # for nvme-loop dependent tests
