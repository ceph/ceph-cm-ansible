### This playbook configures a braggi host to be a Jenkins slave.

- hosts:
    - braggi
    - incerta
    - irvingi
    - adami
    - toko
    - bath
  become: true
  tasks:

# CentOS 9 on these nodes likes to flip around which disk is sda and which is sdb.
# We pick the ~400GB disk by choosing the one < 500 GiB.
  - set_fact:
      jenkins_slave_mount_point: /home/jenkins-build
      disk_flip_host: "{{ ('braggi' in ansible_hostname) or ('adami' in ansible_hostname) }}"
  
  - name: Check if /dev/sda is the 400GB disk (braggi/adami)
    parted:
      device: "/dev/sda"
      unit: GiB
    register: sda_parted
    when: disk_flip_host
  
  - name: Check if /dev/sdb is the 400GB disk (braggi/adami)
    parted:
      device: "/dev/sdb"
      unit: GiB
    register: sdb_parted
    when: disk_flip_host
  
  - name: Set mount_point for jenkins-build (braggi/adami)
    set_fact:
      mount_point: "{{ jenkins_slave_mount_point }}"
    when: disk_flip_host
  
  - name: Select sdb disk if sda is < 500GiB (braggi/adami)
    set_fact:
      disk: /dev/sdb
    when:
      - disk_flip_host
      - sda_parted.disk.size is defined
      - sda_parted.disk.size < 500
  
  - name: Select sda disk if sdb is < 500GiB (braggi/adami)
    set_fact:
      disk: /dev/sda
    when:
      - disk_flip_host
      - sdb_parted.disk.size is defined
      - sdb_parted.disk.size < 500

  # Every disk that / lives on (walks up through partitions, LVM and md).
  - name: Find the disk(s) holding /
    shell: lsblk -nrso NAME,TYPE "$(findmnt -n -o SOURCE /)" | awk '$2 == "disk" {print "/dev/" $1}'
    register: root_disks_out
    changed_when: false
    check_mode: false

  - set_fact:
      root_disks: "{{ root_disks_out.stdout_lines }}"

  # NVMe names are not stable across boots, so take the first candidate that
  # exists and does not hold /.
  - set_fact:
      nvme_candidates: "{{ ['/dev/nvme1n1', '/dev/nvme0n1'] if 'bath' in ansible_hostname else ['/dev/nvme0n1', '/dev/nvme1n1'] }}"
      mount_point: /home/jenkins-build
    when: ansible_hostname is search("incerta|toko|bath")

  - name: Select the NVMe that does not hold / (incerta/toko/bath)
    set_fact:
      disk: "{{ nvme_candidates | select('in', ansible_devices.keys() | map('regex_replace', '^', '/dev/') | list) | reject('in', root_disks) | first | default('') }}"
    when: ansible_hostname is search("incerta|toko|bath")

# Setting the mountpoint to libvirt/images on irvinigi because I'm adding two
# right now as CentOS7 Vagrant builders.
  - set_fact:
      disk: /dev/sdc
      mount_point: /var/lib/libvirt/images
    when: '"irvingi" in ansible_hostname'

  - name: List mounts on the target disk
    command: lsblk -nro MOUNTPOINT "{{ disk }}"
    register: disk_mounts
    changed_when: false
    check_mode: false
    when: disk | default('') | length > 0

  # The disk is zapped below; never let that be the OS disk.
  - name: Refuse to wipe the OS disk or a disk with other mounts
    assert:
      that:
        - disk | default('') | length > 0
        - disk not in root_disks
        - disk_mounts.stdout_lines | reject('equalto', '') | reject('equalto', mount_point) | list | length == 0
      fail_msg: "Refusing to wipe {{ disk | default('(none selected)') }}: / is on {{ root_disks }}, mounts on it: {{ disk_mounts.stdout_lines | default([]) | reject('equalto', '') | list }}"

  - name: "Create {{ mount_point }} home dir"
    file:
      path: "{{ mount_point }}"
      state: directory

  - name: Install xfsprogs (Ubuntu)
    package:
      name: xfsprogs
      state: latest
    when: ansible_os_family == "Debian"

  - name: Unmount (ignore if not mounted)
    mount:
      path: "{{ mount_point }}"
      state: unmounted
    ignore_errors: true

  - name: Zap disk
    command: "sgdisk -Z {{ disk }}"

  - name: Configure disk
    filesystem:
      fstype: xfs
      dev: "{{ disk }}"

  - name: Get XFS UUID
    command: "blkid -s UUID -o value {{ disk }}"
    register: xfs_uuid
    changed_when: false

  - name: Mount disk (fstab uses UUID)
    mount:
      path: "{{ mount_point }}"
      src: "UUID={{ xfs_uuid.stdout }}"
      fstype: xfs
      state: mounted
