---
# Ship journald + auditd from the lab's bare-metal and VM infra hosts to the
# LokiStack on the pok OpenShift cluster.
#
# The exclusions are load-bearing. [infrastructure:children] in the sepia
# inventory pulls in cnv, infra_compute and infra_storage -- those are the 21
# RHCOS nodes of the pok cluster itself. Their journals and auditd logs are
# already collected in-cluster by the ClusterLogForwarder, so running this
# against them would both fail (immutable RHCOS) and double-ingest.
#
# Testnodes are out of scope entirely and are not in any group listed here
# ([testnodes:children] is smithi, ovh, gibba and trial).
#
# Groups, and why each is here:
#   infrastructure       lab services (hv01-04, store01, satellite, chacra, ...)
#   ci_infrastructure    shaman, chacra, jenkins controllers and builders
#   public_facing        docs, tracker, download, lists, git, quay (off-lab)
#   long_running_cluster the LRC -- mira060/093 plus reesi, ivan, doli
#   officinalis, mako    perf boxes
#   folio, sockeni       dev boxes
#   vossi                dev boxes
- hosts: >-
    infrastructure:ci_infrastructure:public_facing:long_running_cluster:officinalis:mako:folio:sockeni:vossi:!infra_compute:!infra_storage:!cnv
  strategy: free
  roles:
    - alloy
  become: true
